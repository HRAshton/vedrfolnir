name: Consumer rehearsal
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to rehearse (read-only)
        required: true
        type: string
      image:
        description: Canonical published GHCR digest reference
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: consumer-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  consumer-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'HRAshton/vedrfolnir' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate requested publication identity
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*)?$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/hrashton/vedrfolnir@sha256:[0-9a-f]{64}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - name: Authenticate to GHCR for OCI attestation verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          python -m pip install .
          python -m scripts.rehearse_release --version "$VERSION" --image "$IMAGE"
