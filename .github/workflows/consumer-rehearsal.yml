name: Consumer rehearsal
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to rehearse (read-only)
        required: true
        type: string
      image:
        description: Canonical published GHCR digest reference
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: consumer-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  consumer-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'HRAshton/vedrfolnir' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate requested publication identity
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*)?$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/hrashton/vedrfolnir@sha256:[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - name: Authenticate to GHCR for OCI attestation verification
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          python -m pip install .
          python -m scripts.rehearse_release --version "$VERSION" --image "$IMAGE"
