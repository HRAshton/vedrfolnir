name: Weekly maintenance image

on:
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if inputs are unchanged (e.g. OS security refresh)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-edge-publication
  cancel-in-progress: false

jobs:
  changes:
    name: Check published image inputs
    if: github.repository == 'HRAshton/vedrfolnir' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.inspect.outputs.changed }}
      image_inputs: ${{ steps.inspect.outputs.image_inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Decide whether a new image is needed
        id: inspect
        env:
          FORCE_REBUILD: ${{ inputs.force || 'false' }}
        run: |
          args=(--check-edge)
          if [[ "$FORCE_REBUILD" == "true" ]]; then args+=(--force); fi
          python3 scripts/maintenance_changes.py "${args[@]}"

  qualify:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - name: Qualify source and runtime image
        env:
          IMAGE_INPUT_SHA256: ${{ needs.changes.outputs.image_inputs }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python -m pip install '.[dev]'
          bash scripts/local_check.sh quick
          docker build --build-arg INSTALL_MSSQL=false \
            --label "org.opencontainers.image.source=https://github.com/HRAshton/vedrfolnir" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.vedrfolnir.image-input-sha256=$IMAGE_INPUT_SHA256" \
            --tag vedrfolnir:weekly-qualified .
          actual="$(docker image inspect vedrfolnir:weekly-qualified --format '{{ index .Config.Labels "org.vedrfolnir.image-input-sha256" }}')"
          [[ "$actual" == "$IMAGE_INPUT_SHA256" ]]
          python scripts/release_smoke.py --image vedrfolnir:weekly-qualified
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: vedrfolnir:weekly-qualified
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: container-audit.json
      - name: Enforce bounded vulnerability exceptions
        run: |
          python scripts/check_container_audit.py \
            --audit container-audit.json \
            --policy security/container-risk-acceptances.json \
            --decision container-audit-decision.json
      - name: Save exact qualified image and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/weekly-image"
          docker save -o "$RUNNER_TEMP/weekly-image/image.tar" vedrfolnir:weekly-qualified
          (cd "$RUNNER_TEMP/weekly-image" && sha256sum image.tar > SHA256SUMS)
          printf 'Source SHA: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-weekly-image
          path: |
            ${{ runner.temp }}/weekly-image/image.tar
            ${{ runner.temp }}/weekly-image/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  scan-existing:
    needs: changes
    if: needs.changes.outputs.changed == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ghcr.io/hrashton/vedrfolnir:edge
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: container-audit.json
      - name: Audit existing image without rebuilding
        run: |
          python3 scripts/check_container_audit.py \
            --audit container-audit.json \
            --policy security/container-risk-acceptances.json \
            --decision container-audit-decision.json

  publish:
    needs: qualify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualified-weekly-image
          path: ${{ runner.temp }}/weekly-image
      - name: Verify and load qualified image
        working-directory: ${{ runner.temp }}/weekly-image
        run: |
          sha256sum -c SHA256SUMS
          docker load -i image.tar
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push uniquely tagged candidate, never edge yet
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/hrashton/vedrfolnir:edge-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag vedrfolnir:weekly-qualified "$image"
          docker push "$image"
          docker pull "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Qualified digest: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  attest:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/hrashton/vedrfolnir
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true

  promote:
    needs: [publish, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move edge only after completed provenance
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "ghcr.io/hrashton/vedrfolnir@$DIGEST"
          docker tag "ghcr.io/hrashton/vedrfolnir@$DIGEST" ghcr.io/hrashton/vedrfolnir:edge
          output="$(docker push ghcr.io/hrashton/vedrfolnir:edge)"
          printf '%s\n' "$output"
          pushed="$(printf '%s\n' "$output" | grep -Eo 'digest: sha256:[0-9a-f]{64}' | tail -n 1 | awk '{print $2}')"
          [[ "$pushed" == "$DIGEST" ]] || {
            echo "Published edge digest differs from attested candidate; investigate before use" >&2
            exit 1
          }
          printf 'Promoted attested digest: %s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
