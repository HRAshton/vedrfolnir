name: Dependency security
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  audit:
    name: Python vulnerability audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 15) and sys.version_info.releaselevel == "final", sys.version'
          python -m venv .audit
          .audit/bin/python -m pip install . pip-audit
          .audit/bin/python -m pip_audit --format json --output audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-vulnerability-audit
          path: audit.json
          if-no-files-found: warn
