name: Maintenance release assessment
on:
  schedule:
    - cron: '17 9 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eligibility:
    if: github.repository == 'HRAshton/vedrfolnir' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assess release candidates without mutation
        run: python -m scripts.plan_maintenance_release
