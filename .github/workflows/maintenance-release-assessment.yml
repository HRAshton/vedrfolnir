name: Maintenance release assessment
on:
  schedule:
    - cron: '17 9 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eligibility:
    if: github.repository == 'HRAshton/vedrfolnir' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assess release candidates without mutation
        run: python -m scripts.plan_maintenance_release
