name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Published version to rehearse (read-only)
        required: true
        type: string
      image:
        description: Canonical published GHCR digest reference
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.repository == 'HRAshton/vedrfolnir'
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - run: python -m pip install '.[dev]'
      - id: guard
        run: python scripts/validate_release.py
        env:
          GH_TOKEN: ${{ github.token }}
  verify-tag-rules:
    name: Verify release tag rulesets
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-ruleset-audit
    permissions: {}
    steps:
      # Isolated, reviewer-gated ruleset credential: never checkout or run project code.
      - name: Verify immutable tags and absence of bypass actors
        env:
          RELEASE_RULESET_AUDIT_TOKEN: ${{ secrets.RELEASE_RULESET_AUDIT_TOKEN }}
        run: |
          python - <<'RULESET_AUDIT'
          """Verify live release-tag bypass settings without executing project code."""
          import json
          import os
          import re
          from urllib.request import Request, urlopen
          
          REPO = "HRAshton/vedrfolnir"
          API = "https://api.github.com/repos/" + REPO
          
          
          def verify_rulesets(listing, get_ruleset):
              if not isinstance(listing, list) or len(listing) >= 100:
                  raise ValueError("Cannot completely enumerate rulesets without pagination")
              found = False
              visited = set()
              for summary in listing:
                  if not isinstance(summary, dict):
                      raise ValueError("Malformed repository ruleset summary")
                  if summary.get("target") != "tag":
                      continue
                  identifier = summary.get("id")
                  if type(identifier) is not int or identifier < 1 or identifier in visited:
                      raise ValueError("Invalid or duplicate tag ruleset identifier")
                  visited.add(identifier)
                  rule = get_ruleset(identifier)
                  if (not isinstance(rule, dict)
                          or rule.get("id") != identifier or rule.get("target") != "tag"):
                      raise ValueError("Cannot verify the retrieved tag ruleset identity")
                  if rule.get("enforcement") != "active":
                      continue
                  # Check every active tag ruleset, including inherited ones.
                  if type(rule.get("bypass_actors")) is not list:
                      raise ValueError("Tag ruleset bypass_actors is missing or redacted")
                  if rule["bypass_actors"]:
                      raise ValueError("Active tag ruleset has bypass actors")
                  conditions = rule.get("conditions", {}).get("ref_name", {})
                  rules = rule.get("rules", [])
                  if (isinstance(conditions, dict)
                          and "refs/tags/v*" in conditions.get("include", [])
                          and conditions.get("exclude") == []
                          and isinstance(rules, list)
                          and {"update", "deletion"} <= {
                              item.get("type") for item in rules if isinstance(item, dict)
                          }):
                      found = True
              if not found:
                  raise ValueError("No verified active immutable v* tag ruleset")
              return len(visited)
          
          
          def main():
              if os.environ.get("GITHUB_REPOSITORY") != REPO:
                  raise ValueError("Only the canonical repository may publish")
              if not re.fullmatch(r"refs/tags/v[0-9][0-9A-Za-z.]*", os.environ.get("GITHUB_REF", "")):
                  raise ValueError("Release requires a version tag")
              token = os.environ.get("RELEASE_RULESET_AUDIT_TOKEN", "")
              if not token:
                  raise ValueError("Missing protected RELEASE_RULESET_AUDIT_TOKEN credential")
          
              def get(path):
                  request = Request(API + path, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                  })
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
          
              listing = get("/rulesets?per_page=100&includes_parents=true")
              count = verify_rulesets(listing, lambda ident: get(
                  "/rulesets/" + str(ident) + "?includes_parents=true"))
              print(f"Verified release tag protection; {count} tag rulesets inspected")
          
          
          if __name__ == "__main__":
              main()
          RULESET_AUDIT
  qualify:
    needs: [authorize, verify-tag-rules]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 15) and sys.version_info.releaselevel == "final"'
          python -m pip install '.[dev]' pip-audit
          bash scripts/local_check.sh quick
          python scripts/qualify_packages.py --dist dist --mssql
          python -m pip_audit
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          build-args: INSTALL_MSSQL=false
          tags: vedrfolnir:qualified
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          python scripts/release_smoke.py --image vedrfolnir:qualified
          sha256sum "$RUNNER_TEMP/image.tar" | sed "s|$RUNNER_TEMP/||" > "$RUNNER_TEMP/image.sha256"
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: vedrfolnir:qualified
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: container-audit.json
      - name: Enforce reviewed and expiring vulnerability policy
        if: always()
        run: |
          python scripts/check_container_audit.py \
            --audit container-audit.json \
            --policy security/container-risk-acceptances.json \
            --decision container-audit-decision.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-container-vulnerability-audit
          path: |
            container-audit.json
            container-audit-decision.json
          if-no-files-found: warn
      - name: Record executed qualification and runtime versions
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          python - <<'PYTHON'
          import json, os, sys, river
          from pathlib import Path
          report = {'python': sys.version, 'river': river.__version__, 'source_sha': os.environ['SOURCE_SHA'], 'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'checks': ['quick', 'qualified wheel/sdist/MSSQL-extra installs', 'pip-audit', 'demo/CSV image backup/restart smoke', 'full image scan and reviewed expiring vulnerability risk gate']}
          Path('dist/qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          PYTHON
          cd dist
          sha256sum qualification.json >> SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-packages
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-image
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/image.sha256
          if-no-files-found: error
  image:
    needs: [authorize, qualify]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-image
      - run: sha256sum -c image.sha256
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        env:
          TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          reference="ghcr.io/hrashton/vedrfolnir:$TAG"
          # Transport/authentication failures must not be mistaken for a missing tag.
          if docker manifest inspect "$reference" > existing.json 2> inspect-error; then
            echo 'Version already exists; verify prior release or use a new RC' >&2
            exit 1
          fi
          grep -Eq 'manifest unknown|no such manifest|MANIFEST_UNKNOWN' inspect-error
          docker load --input image.tar
          docker tag vedrfolnir:qualified "$reference"
          docker push "$reference"
          docker pull "$reference"
          digest="$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  pulled-image:
    needs: [authorize, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - run: |
          python -m pip install .
          python scripts/release_smoke.py --pull --image "ghcr.io/hrashton/vedrfolnir@$DIGEST"
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
  sbom:
    needs: [authorize, image, pulled-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-packages
          path: dist
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/hrashton/vedrfolnir@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: dist/container.spdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Manifest and checksums for exact release assets
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist')
          files = sorted(root.glob('*.whl')) + sorted(root.glob('*.tar.gz')) + [root / 'container.spdx.json', root / 'qualification.json']
          artifacts = {file.name: {'sha256': hashlib.sha256(file.read_bytes()).hexdigest(), 'size': file.stat().st_size} for file in files}
          manifest = {'version': os.environ['VERSION'], 'source_sha': os.environ['SOURCE_SHA'], 'image': 'ghcr.io/hrashton/vedrfolnir@' + os.environ['IMAGE_DIGEST'], 'artifacts': artifacts}
          (root / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          cd dist
          sha256sum -- *.whl *.tar.gz container.spdx.json release-manifest.json qualification.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
  attest:
    needs: [authorize, image, sbom]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/hrashton/vedrfolnir
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ghcr.io/hrashton/vedrfolnir
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: dist/container.spdx.json
          push-to-registry: true
  pypi:
    needs: [qualify, pulled-image, attest]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - run: |
          cd dist
          sha256sum -c SHA256SUMS
          mkdir ../publish
          cp -- *.whl *.tar.gz ../publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish
  github-release:
    needs: [authorize, image, pulled-image, pypi, attest]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
          VERSION: ${{ needs.authorize.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          printf 'Experimental Linux/amd64, CPython 3.15, demo/CSV, one worker/SQLite instance. MSSQL and production ETA accuracy are unqualified.\n\nSource: %s\nPackage: %s\nImage: ghcr.io/hrashton/vedrfolnir@%s\n\nVerify SHA256SUMS, release-manifest.json and gh attestation verify for package files/OCI digest. SBOM: container.spdx.json. PyPI OIDC provides its own package attestations. See the release contract and operations guide.\n' "$SOURCE_SHA" "$VERSION" "$DIGEST" > notes.md
          python -c 'import json; q=json.load(open("qualification.json")); print("\nQualification run:", q["run_url"]); print("Python:", q["python"]); print("River:", q["river"]); print("Executed checks:", ", ".join(q["checks"]))' >> notes.md
          flags=()
          if [[ "$VERSION" == *rc* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" --repo HRAshton/vedrfolnir --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" -- *.whl *.tar.gz SHA256SUMS container.spdx.json release-manifest.json qualification.json
  promote:
    needs: [authorize, image, github-release]
    if: ${{ !contains(needs.authorize.outputs.version, 'rc') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker pull "ghcr.io/hrashton/vedrfolnir@$DIGEST"
          docker tag "ghcr.io/hrashton/vedrfolnir@$DIGEST" ghcr.io/hrashton/vedrfolnir:latest
          docker push ghcr.io/hrashton/vedrfolnir:latest

  consumer-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'HRAshton/vedrfolnir' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate requested publication identity
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*)?$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/hrashton/vedrfolnir@sha256:[0-9a-f]{64}$ ]]
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - name: Authenticate to GHCR for OCI attestation verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          python -m pip install .
          python -m scripts.rehearse_release --version "$VERSION" --image "$IMAGE"
