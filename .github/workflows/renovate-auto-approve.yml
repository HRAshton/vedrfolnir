name: Renovate safe approval
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: master
          persist-credentials: false
      - name: Verify bot PR and exact dependency diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/approve_renovate.py "$GITHUB_EVENT_PATH"
