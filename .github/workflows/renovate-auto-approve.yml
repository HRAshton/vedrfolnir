name: Renovate safe approval
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Verify bot PR and exact dependency diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/approve_renovate.py "$GITHUB_EVENT_PATH"
