name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-package:
    name: Python and package validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up stable CPython 3.15
        id: python
        continue-on-error: true
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'
          allow-prereleases: false
      - name: Build verified CPython when no hosted binary exists
        if: steps.python.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev libgdbm-dev libncurses-dev libexpat1-dev uuid-dev
          bash scripts/setup_python315.sh "$RUNNER_TEMP/python315"
          echo "$RUNNER_TEMP/python315/bin" >> "$GITHUB_PATH"
      - name: Verify interpreter and install development dependencies
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 15) and sys.version_info.releaselevel == "final", sys.version; print(sys.version)'
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          python -c 'import sys, river; print(sys.version); print("River", river.__version__)'
      - name: Unit tests and smoke simulation
        run: |
          bash scripts/local_check.sh quick
          python -m simulator.validation --quick --output benchmark-results/ci-smoke
      - name: Build and qualify wheel and sdist once
        run: python scripts/qualify_packages.py --dist "$RUNNER_TEMP/qualified-dist" --mssql
      - name: Resolve and verify container dependency constraints
        run: |
          python scripts/generate_container_constraints.py --output "$RUNNER_TEMP/container-constraints.generated.txt"
          cat "$RUNNER_TEMP/container-constraints.generated.txt"
          diff -u requirements/container-constraints.txt "$RUNNER_TEMP/container-constraints.generated.txt"
      - name: Compile Python sources
        run: python -m compileall -q src simulator scripts tests

  tooling:
    name: Shell and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check every shell script and workflow
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck "${scripts[@]}"
          "$(go env GOPATH)/bin/actionlint" -color

  container:
    name: Container qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine image relevance
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if [[ "$EVENT_NAME" != pull_request ]] || grep -Eq '^(src/|tests/|scripts/|Dockerfile|pyproject.toml|compose|\.github/)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          python-version: '3.15'
          allow-prereleases: false
      - name: Build and smoke the candidate
        if: steps.changes.outputs.relevant == 'true'
        run: |
          python -m pip install '.[dev]'
          docker build --build-arg INSTALL_MSSQL=false --tag vedrfolnir:ci .
          python scripts/release_smoke.py --image vedrfolnir:ci
          docker compose -f compose.release.yaml config --quiet
        env:
          VEDRFOLNIR_IMAGE: vedrfolnir:ci
          ETA_ADMIN_TOKEN: ci-configuration-only-placeholder-unique-value
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        if: steps.changes.outputs.relevant == 'true'
        with:
          image: vedrfolnir:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: container-audit.json
      - name: Enforce reviewed and expiring vulnerability policy
        if: always() && steps.changes.outputs.relevant == 'true'
        run: |
          python scripts/check_container_audit.py \
            --audit container-audit.json \
            --policy security/container-risk-acceptances.json \
            --decision container-audit-decision.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.changes.outputs.relevant == 'true'
        with:
          name: container-vulnerability-audit
          path: |
            container-audit.json
            container-audit-decision.json
          if-no-files-found: warn
